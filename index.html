<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 협업 패들렛 - 칸반 & 자유 캔버스</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen select-none sm:select-auto">
  <div id="root"></div>

  <!-- Firebase SDK (Modular v11.6.1) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp,
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      getFirestore,
      collection,
      doc,
      onSnapshot,
      setDoc,
      deleteDoc
    };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_BOARDS = [
      {
        id: 'board-1',
        title: '🚀 팀 브레인스토밍 & 프로젝트 보드',
        description: '아이디어, 자료 조사, 그리고 할 일을 실시간으로 함께 공유하는 공간입니다.',
        layout: 'grid',
        bgType: 'gradient',
        bgValue: 'from-slate-900 via-indigo-950 to-slate-900',
        password: '',
        columns: ['할 일 (To Do)', '진행 중', '완료'],
        posts: [
          {
            id: 'post-1',
            title: '🎨 브랜드 아이덴티티 개편',
            content: '핵심 비주얼 에셋을 새롭게 업데이트합니다. 세련된 컬러 팔레트와 모던한 타이포그래피를 검토 중입니다.',
            column: '진행 중',
            color: '#fef3c7',
            tags: ['디자인', '중요'],
            likes: 12,
            pinned: true,
            x: 40,
            y: 40,
            media: {
              type: 'image',
              url: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=800&q=80',
              caption: '디자인 무드보드 컨셉'
            },
            checklist: [
              { id: 'c1', text: '컬러 대비 검토', done: true },
              { id: 'c2', text: '로고 벡터 추출', done: false }
            ],
            comments: [
              { id: 'cm1', author: '김철수', text: '컬러톤이 아주 따뜻하고 좋네요!', timestamp: '오전 10:15' }
            ]
          }
        ]
      }
    ];

    const BG_OPTIONS = [
      { label: '인디고 나이트', type: 'gradient', value: 'from-slate-900 via-indigo-950 to-slate-900' },
      { label: '선셋 글로우', type: 'gradient', value: 'from-rose-900 via-purple-900 to-slate-900' },
      { label: '에메랄드 포레스트', type: 'gradient', value: 'from-emerald-950 via-teal-900 to-slate-900' },
      { label: '미니멀 라이트', type: 'gradient', value: 'from-slate-100 via-gray-100 to-slate-200' },
      { label: '소프트 피치', type: 'gradient', value: 'from-orange-100 via-amber-50 to-rose-100' },
      { label: '퓨어 다크', type: 'solid', value: 'bg-gray-950' }
    ];

    const CARD_COLORS = [
      { label: '클린 화이트', bg: '#ffffff', border: '#e2e8f0' },
      { label: '따뜻한 앰버', bg: '#fef3c7', border: '#fde68a' },
      { label: '스카이 블루', bg: '#e0f2fe', border: '#bae6fd' },
      { label: '프레시 그린', bg: '#dcfce7', border: '#bbf7d0' },
      { label: '로즈 핑크', bg: '#ffe4e6', border: '#fecdd3' },
      { label: '라벤더', bg: '#f3e8ff', border: '#e9d5ff' },
      { label: '차콜 다크', bg: '#1e293b', border: '#334155' }
    ];

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [dbInstance, setDbInstance] = useState(null);
      const [isCloudConnected, setIsCloudConnected] = useState(false);
      const [syncStatusText, setSyncStatusText] = useState('클라우드 연결 확인 중...');
      const [toastMsg, setToastMsg] = useState('');
      const [boardModalError, setBoardModalError] = useState('');

      const [boards, setBoards] = useState(DEFAULT_BOARDS);
      const [activeBoardId, setActiveBoardId] = useState('board-1');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTag, setSelectedTag] = useState('ALL');

      const [unlockedBoards, setUnlockedBoards] = useState({});
      const [inputPassword, setInputPassword] = useState('');

      const [isPostModalOpen, setIsPostModalOpen] = useState(false);
      const [isBoardModalOpen, setIsBoardModalOpen] = useState(false);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
      const [isAdminSettingsOpen, setIsAdminSettingsOpen] = useState(false);
      const [editingPost, setEditingPost] = useState(null);

      // 클라우드에 동기화되는 마스터 관리자 비밀번호 (초기값 1234)
      const [adminSecret, setAdminSecret] = useState('1234');
      const [adminPwForm, setAdminPwForm] = useState({ current: '', next: '', confirm: '' });
      const [adminPwError, setAdminPwError] = useState('');

      const [postForm, setPostForm] = useState({
        title: '',
        content: '',
        column: '할 일 (To Do)',
        color: '#ffffff',
        tagsInput: '',
        mediaType: 'none',
        mediaUrl: '',
        mediaCaption: '',
        mediaTitle: '',
        checklistText: ''
      });

      const [boardForm, setBoardForm] = useState({
        title: '',
        description: '',
        layout: 'grid',
        password: '',
        creatorPassword: '',
        bgValue: BG_OPTIONS[0].value,
        bgType: BG_OPTIONS[0].type
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const appId = typeof __app_id !== 'undefined' ? __app_id : 'padlet-live-board';

      useEffect(() => {
        const initFirebase = async () => {
          if (!window.FirebaseSDK) return;
          const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseSDK;

          const firebaseConfig = {
            apiKey: "AIzaSyB_qVG_HiPIr0ysswdt4BHb5FL8f1oM6FI",
  authDomain: "my-padlet-4fbdc.firebaseapp.com",
  projectId: "my-padlet-4fbdc",
  storageBucket: "my-padlet-4fbdc.firebasestorage.app",
  messagingSenderId: "91914410908",
  appId: "1:91914410908:web:6d11a239b689af59e88659"
          };

          if (!firebaseConfig || firebaseConfig.apiKey === "AIzaSy_실제_키_입력" || firebaseConfig.apiKey.includes("내_실제")) {
            setSyncStatusText('설정 필요 (firebaseConfig 미입력)');
            return;
          }

          try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            setDbInstance(db);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) {
                setIsCloudConnected(true);
                setSyncStatusText('실시간 클라우드 동기화');
              }
            });
          } catch (err) {
            console.error('Firebase connection error:', err);
            setSyncStatusText(`인증 오류: ${err.code || err.message}`);
          }
        };

        if (window.FirebaseSDK) {
          initFirebase();
        } else {
          window.addEventListener('firebase-ready', initFirebase);
          return () => window.removeEventListener('firebase-ready', initFirebase);
        }
      }, []);

      useEffect(() => {
        if (!user || !dbInstance || !window.FirebaseSDK) return;
        const { collection, doc, onSnapshot, setDoc } = window.FirebaseSDK;

        // 1. 보드 목록 실시간 동기화
        const boardsRef = collection(dbInstance, 'artifacts', appId, 'public', 'data', 'boards');
        const unsubscribe = onSnapshot(
          boardsRef,
          (snapshot) => {
            if (!snapshot.empty) {
              const remoteBoards = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
              setBoards(remoteBoards);
            } else {
              DEFAULT_BOARDS.forEach((b) => {
                setDoc(doc(dbInstance, 'artifacts', appId, 'public', 'data', 'boards', b.id), b);
              });
            }
          },
          (error) => {
            console.error('Firestore sync error:', error);
            setIsCloudConnected(false);
            setSyncStatusText(`DB 권한 오류: ${error.code || '규칙 확인 필요'}`);
          }
        );

        // 2. 마스터 관리자 비밀번호 실시간 동기화
        const configDocRef = doc(dbInstance, 'artifacts', appId, 'public', 'data', 'settings', 'admin');
        const unsubConfig = onSnapshot(
          configDocRef,
          (docSnap) => {
            if (docSnap.exists() && docSnap.data().secret) {
              setAdminSecret(docSnap.data().secret);
            } else {
              setDoc(configDocRef, { secret: '1234' });
            }
          },
          (err) => console.error('Admin config sync error:', err)
        );

        return () => {
          unsubscribe();
          unsubConfig();
        };
      }, [user, dbInstance]);

      const saveBoard = async (updatedBoard) => {
        setBoards((prev) => prev.map((b) => (b.id === updatedBoard.id ? updatedBoard : b)));
        if (dbInstance && user && window.FirebaseSDK) {
          const { doc, setDoc } = window.FirebaseSDK;
          try {
            await setDoc(doc(dbInstance, 'artifacts', appId, 'public', 'data', 'boards', updatedBoard.id), updatedBoard);
          } catch (err) {
            console.error('Cloud save failed:', err);
          }
        }
      };

      const activeBoard = boards.find((b) => b.id === activeBoardId) || boards[0] || DEFAULT_BOARDS[0];
      const isBoardProtected = activeBoard && activeBoard.password && !unlockedBoards[activeBoard.id];

      const availableTags = Array.from(
        new Set((activeBoard?.posts || []).flatMap((p) => p.tags || []))
      );

      const filteredPosts = (activeBoard?.posts || []).filter((post) => {
        const matchesSearch =
          post.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          post.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (post.tags && post.tags.some((t) => t.toLowerCase().includes(searchQuery.toLowerCase())));
        const matchesTag = selectedTag === 'ALL' || (post.tags && post.tags.includes(selectedTag));
        return matchesSearch && matchesTag;
      });

      const sortedPosts = [...filteredPosts].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

      // 버튼 클릭으로 바로 실행되는 보드 생성 함수
      const handleCreateBoardClick = () => {
        setBoardModalError('');

        if (!boardForm.title.trim()) {
          setBoardModalError('⚠️ 보드 이름을 입력해주세요.');
          return;
        }

        if (boardForm.creatorPassword.trim() !== adminSecret) {
          setBoardModalError('⚠️ 관리자 생성 비밀번호가 일치하지 않습니다.');
          return;
        }

        const newBoard = {
          id: `board-${Date.now()}`,
          title: boardForm.title.trim(),
          description: boardForm.description.trim(),
          layout: boardForm.layout,
          bgType: boardForm.bgType,
          bgValue: boardForm.bgValue,
          password: boardForm.password.trim(),
          columns: ['할 일 (To Do)', '진행 중', '완료'],
          posts: []
        };

        const updatedBoards = [...boards, newBoard];
        setBoards(updatedBoards);
        if (newBoard.password) {
          setUnlockedBoards(prev => ({ ...prev, [newBoard.id]: true }));
        }

        if (dbInstance && user && window.FirebaseSDK) {
          const { doc, setDoc } = window.FirebaseSDK;
          try {
            setDoc(doc(dbInstance, 'artifacts', appId, 'public', 'data', 'boards', newBoard.id), newBoard);
          } catch (err) {
            console.error('Cloud board creation error:', err);
          }
        }

        setActiveBoardId(newBoard.id);
        setIsBoardModalOpen(false);
        setBoardModalError('');
        setBoardForm({
          title: '',
          description: '',
          layout: 'grid',
          password: '',
          creatorPassword: '',
          bgValue: BG_OPTIONS[0].value,
          bgType: BG_OPTIONS[0].type
        });
        showToast('새 보드가 성공적으로 생성되었습니다!');
      };

      // 마스터 관리자 비밀번호 변경 함수
      const handleUpdateAdminSecret = async () => {
        setAdminPwError('');

        if (adminPwForm.current.trim() !== adminSecret) {
          setAdminPwError('⚠️ 현재 비밀번호가 일치하지 않습니다.');
          return;
        }
        if (!adminPwForm.next.trim() || adminPwForm.next.trim().length < 4) {
          setAdminPwError('⚠️ 새 비밀번호는 최소 4자리 이상 입력해주세요.');
          return;
        }
        if (adminPwForm.next.trim() !== adminPwForm.confirm.trim()) {
          setAdminPwError('⚠️ 새 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        const newSecret = adminPwForm.next.trim();
        setAdminSecret(newSecret);

        if (dbInstance && user && window.FirebaseSDK) {
          const { doc, setDoc } = window.FirebaseSDK;
          try {
            await setDoc(doc(dbInstance, 'artifacts', appId, 'public', 'data', 'settings', 'admin'), {
              secret: newSecret
            });
          } catch (err) {
            console.error('Admin password save failed:', err);
          }
        }

        setAdminPwForm({ current: '', next: '', confirm: '' });
        setIsAdminSettingsOpen(false);
        showToast('관리자 비밀번호가 안전하게 변경되었습니다!');
      };

      const handleUnlockBoard = (e) => {
        e.preventDefault();
        if (inputPassword === activeBoard.password) {
          setUnlockedBoards(prev => ({ ...prev, [activeBoard.id]: true }));
          setInputPassword('');
          showToast('잠금이 해제되었습니다!');
        } else {
          showToast('비밀번호가 틀렸습니다!');
        }
      };

      const handleDeleteBoard = async (id) => {
        if (boards.length <= 1) {
          showToast('최소 1개의 보드는 유지해야 합니다.');
          return;
        }
        const remaining = boards.filter((b) => b.id !== id);
        setBoards(remaining);
        setActiveBoardId(remaining[0].id);

        if (dbInstance && user && window.FirebaseSDK) {
          const { doc, deleteDoc } = window.FirebaseSDK;
          await deleteDoc(doc(dbInstance, 'artifacts', appId, 'public', 'data', 'boards', id));
        }
        showToast('보드가 삭제되었습니다.');
      };

      const handleSavePost = (e) => {
        e.preventDefault();
        if (!postForm.title.trim() && !postForm.content.trim()) return;

        const parsedTags = postForm.tagsInput
          ? postForm.tagsInput.split(',').map((t) => t.trim()).filter(Boolean)
          : [];

        let mediaObj = null;
        if (postForm.mediaType === 'image' && postForm.mediaUrl) {
          mediaObj = { type: 'image', url: postForm.mediaUrl, caption: postForm.mediaCaption || '' };
        } else if (postForm.mediaType === 'link' && postForm.mediaUrl) {
          mediaObj = { type: 'link', url: postForm.mediaUrl, title: postForm.mediaTitle || postForm.mediaUrl };
        }

        const checklistItems = postForm.checklistText
          ? postForm.checklistText
              .split('\n')
              .filter((line) => line.trim())
              .map((item, idx) => ({ id: `c-${Date.now()}-${idx}`, text: item.trim(), done: false }))
          : [];

        let updatedPosts;
        if (editingPost) {
          updatedPosts = activeBoard.posts.map((p) =>
            p.id === editingPost.id
              ? {
                  ...p,
                  title: postForm.title,
                  content: postForm.content,
                  column: postForm.column || activeBoard.columns[0],
                  color: postForm.color,
                  tags: parsedTags,
                  media: mediaObj || (postForm.mediaType === 'none' ? null : p.media),
                  checklist: checklistItems.length > 0 ? checklistItems : p.checklist
                }
              : p
          );
          showToast('카드가 수정되었습니다.');
        } else {
          const newPost = {
            id: `post-${Date.now()}`,
            title: postForm.title || '제목 없음',
            content: postForm.content,
            column: postForm.column || activeBoard.columns[0] || '할 일 (To Do)',
            color: postForm.color,
            tags: parsedTags,
            likes: 0,
            pinned: false,
            x: Math.floor(Math.random() * 240) + 40,
            y: Math.floor(Math.random() * 180) + 40,
            media: mediaObj,
            checklist: checklistItems,
            comments: []
          };
          updatedPosts = [newPost, ...activeBoard.posts];
          showToast('새 카드가 추가되었습니다!');
        }

        saveBoard({ ...activeBoard, posts: updatedPosts });
        closePostModal();
      };

      const openEditPost = (post) => {
        setEditingPost(post);
        setPostForm({
          title: post.title,
          content: post.content,
          column: post.column,
          color: post.color,
          tagsInput: (post.tags || []).join(', '),
          mediaType: post.media?.type || 'none',
          mediaUrl: post.media?.url || '',
          mediaCaption: post.media?.caption || '',
          mediaTitle: post.media?.title || '',
          checklistText: (post.checklist || []).map((c) => c.text).join('\n')
        });
        setIsPostModalOpen(true);
      };

      const closePostModal = () => {
        setIsPostModalOpen(false);
        setEditingPost(null);
        setPostForm({
          title: '',
          content: '',
          column: activeBoard?.columns[0] || '할 일 (To Do)',
          color: '#ffffff',
          tagsInput: '',
          mediaType: 'none',
          mediaUrl: '',
          mediaCaption: '',
          mediaTitle: '',
          checklistText: ''
        });
      };

      const handleCopyShareLink = () => {
        const url = window.location.href;
        const tempInput = document.createElement('input');
        tempInput.value = url;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast('링크가 클립보드에 복사되었습니다!');
      };

      const handleExportJSON = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(activeBoard, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', `${activeBoard.title.replace(/[^a-z0-9가-힣]/gi, '_').toLowerCase()}_export.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      return (
        <div className={`min-h-screen flex flex-col font-sans transition-all duration-300 ${activeBoard.bgType === 'gradient' ? `bg-gradient-to-br ${activeBoard.bgValue}` : activeBoard.bgValue}`}>
          
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-[100] bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 animate-bounce">
              <Icon name="sparkles" className="w-4 h-4" />
              <span>{toastMsg}</span>
            </div>
          )}

          <header className="sticky top-0 z-30 bg-slate-900/85 backdrop-blur-md border-b border-slate-800 text-slate-100 px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
            <div className="flex items-center space-x-3">
              <div className="p-2 bg-indigo-600 rounded-xl shadow-inner relative">
                <Icon name="layers" className="w-5 h-5 text-white" />
                {isCloudConnected && (
                  <span className="absolute -bottom-1 -right-1 flex h-3 w-3">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                  </span>
                )}
              </div>
              <div>
                <div className="flex items-center space-x-1.5">
                  <select
                    value={activeBoardId}
                    onChange={(e) => setActiveBoardId(e.target.value)}
                    className="bg-slate-800 text-slate-100 text-sm sm:text-base font-bold rounded-lg px-2.5 py-1 border border-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none cursor-pointer max-w-[200px] sm:max-w-xs truncate"
                  >
                    {boards.map((b) => (
                      <option key={b.id} value={b.id}>{b.title}</option>
                    ))}
                  </select>

                  <button
                    onClick={() => {
                      setBoardModalError('');
                      setIsBoardModalOpen(true);
                    }}
                    title="새 보드 만들기"
                    className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg border border-slate-700 transition"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                  </button>

                  </div>

                    <div className="flex space-x-2 mb-2.5">
                      <button
                        type="button"
                        onClick={() => setPostForm({ ...postForm, mediaType: 'none' })}

                          postForm.mediaType === 'none' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'

                      <button

                        onClick={() => setPostForm({ ...postForm, mediaType: 'image' })}

                          postForm.mediaType === 'image' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <Icon name="image" className="w-3.5 h-3.5" />
                        <span>이미지</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setPostForm({ ...postForm, mediaType: 'link' })}
                        className={`px-3 py-1 rounded-lg text-xs font-medium flex items-center gap-1 transition ${
                          postForm.mediaType === 'link' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <Icon name="link-2" className="w-3.5 h-3.5" />

                    {postForm.mediaType === 'image' && (
                      <div className="space-y-2">
                        <input

                          placeholder="이미지 주소 입력 (https://...)"

                          onChange={(e) => setPostForm({ ...postForm, mediaUrl: e.target.value })}

                        />
                        <input
                          type="text"
                          placeholder="이미지 캡션 설명 (선택사항)"
                          value={postForm.mediaCaption}
                          onChange={(e) => setPostForm({ ...postForm, mediaCaption: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"
                        />
                      </div>
                    )}

                    {postForm.mediaType === 'link' && (
                      <div className="space-y-2">
                        <input
                          type="url"
                          placeholder="웹사이트 주소 입력 (https://...)"
                          value={postForm.mediaUrl}
                          onChange={(e) => setPostForm({ ...postForm, mediaUrl: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"
                        />
                        <input
                          type="text"
                          placeholder="링크 제목 표시 (선택사항)"
                          value={postForm.mediaTitle}
                          onChange={(e) => setPostForm({ ...postForm, mediaTitle: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-slate-100"
                        />
                      </div>
                    )}
                  </div>

                  {/* 체크리스트 */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1 flex items-center gap-1">
                      <Icon name="check-square" className="w-3.5 h-3.5 text-indigo-400" />
                      체크리스트 항목 (엔터로 줄바꿈 구분)
                    </label>
                    <textarea
                      rows={2}
                      placeholder="할 일 1&#10;할 일 2"
                      value={postForm.checklistText}
                      onChange={(e) => setPostForm({ ...postForm, checklistText: e.target.value })}

                  </div>

                    <button type="button" onClick={closePostModal} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition">취소</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">
                      {editingPost ? '수정 저장' : '올리기'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isShareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 text-slate-100 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <h3 className="text-base font-bold">보드 공유 및 내보내기</h3>
                  <button onClick={() => setIsShareModalOpen(false)} className="text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>

                <div className="space-y-3 text-xs">

                  <button onClick={handleExportJSON} className="w-full py-2.5 bg-slate-800 text-slate-200 font-bold rounded-xl border border-slate-700">JSON 백업 다운로드</button>
                </div>
                <div className="flex justify-end pt-2"><button onClick={() => setIsShareModalOpen(false)} className="px-4 py-2 bg-slate-800 text-xs text-slate-300 rounded-xl">닫기</button></div>
              </div>

              <div className="bg-slate-900 border border-slate-700 text-slate-100 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">

                    />

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">새 비밀번호 (4자리 이상)</label>
                    <input
                      type="password"
                      placeholder="새로운 비밀번호 입력"
                      value={adminPwForm.next}
                      onChange={(e) => setAdminPwForm({ ...adminPwForm, next: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:ring-2 focus:ring-amber-500 focus:outline-none"

                    <label className="block text-slate-300 font-semibold mb-1">새 비밀번호 확인</label>
                    <input
                      type="password"
                      placeholder="새 비밀번호 다시 입력"
                      value={adminPwForm.confirm}
                      onChange={(e) => setAdminPwForm({ ...adminPwForm, confirm: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:ring-2 focus:ring-amber-500 focus:outline-none"
                    />

                    <div className="p-2.5 bg-rose-950/90 border border-rose-500/60 rounded-xl text-rose-200 text-xs font-semibold">

    // 개별 카드 렌더링 컴포넌트 (PostCard)
    function PostCard({
      post,
      columns,
      onLike,
      onPin,
      onEdit,
      onDelete,
      onToggleChecklist,
      onAddComment,
      onMoveColumn
    }) {
      const [commentInput, setCommentInput] = useState('');
      const [showComments, setShowComments] = useState(false);

      const handleSubmitComment = (e) => {
        e.preventDefault();
        if (commentInput.trim()) {
          onAddComment(commentInput.trim());
          setCommentInput('');
        }
      };

      const isDarkBg = post.color === '#1e293b';

      return (
        <div
          className={`group relative rounded-2xl p-4 shadow-md hover:shadow-xl transition-all duration-200 border flex flex-col justify-between ${
            isDarkBg ? 'text-slate-100 border-slate-700' : 'text-slate-800 border-slate-200/80'
          }`}
          style={{ backgroundColor: post.color || '#ffffff' }}
        >
          {post.pinned && (
            <div className="absolute -top-2 -right-2 bg-amber-500 text-white p-1 rounded-full shadow-md z-10" title="상단 고정됨">
              <Icon name="pin" className="w-3.5 h-3.5" />
            </div>
          )}

          <div>
            <div className="flex items-start justify-between gap-2 mb-2">
              <h3 className="font-bold text-sm leading-snug">{post.title}</h3>
              <div className="opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-1 bg-black/10 p-1 rounded-lg">
                <button
                  type="button"
                  onClick={onPin}
                  title={post.pinned ? '고정 해제' : '상단 고정'}
                  className="p-1 hover:bg-black/10 rounded transition text-slate-600 hover:text-amber-500"
                >
                  <Icon name="pin" className={`w-3.5 h-3.5 ${post.pinned ? 'text-amber-500' : ''}`} />
                </button>
                <button
                  type="button"
                  onClick={onEdit}
                  title="카드 편집"
                  className="p-1 hover:bg-black/10 rounded transition text-slate-600 hover:text-indigo-600"
                >
                  <Icon name="edit-3" className="w-3.5 h-3.5" />
                </button>
                <button
                  type="button"
                  onClick={onDelete}
                  title="카드 삭제"
                  className="p-1 hover:bg-black/10 rounded transition text-slate-600 hover:text-rose-600"
                >
                  <Icon name="trash-2" className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>

            {post.content && (
              <p className={`text-xs mb-3 whitespace-pre-line leading-relaxed ${isDarkBg ? 'text-slate-300' : 'text-slate-600'}`}>
                {post.content}
              </p>
            )}

            {post.media && (
              <div className="mb-3 rounded-xl overflow-hidden border border-black/10 bg-black/5">
                {post.media.type === 'image' && (
                  <div>
                    <img
                      src={post.media.url}
                      alt={post.media.caption || '첨부 이미지'}
                      className="w-full h-36 object-cover hover:scale-105 transition-transform duration-300"
                    />
                    {post.media.caption && (
                      <p className="text-[10px] p-1.5 text-center opacity-70 font-medium">
                        {post.media.caption}
                      </p>
                    )}
                  </div>
                )}

                {post.media.type === 'link' && (
                  <a
                    href={post.media.url}
                    target="_blank"
                    rel="noreferrer"
                    className="p-2.5 flex items-start space-x-2 hover:bg-black/10 transition block"
                  >
                    <Icon name="link-2" className="w-4 h-4 shrink-0 text-indigo-500 mt-0.5" />
                    <div className="overflow-hidden">
                      <div className="text-xs font-semibold truncate flex items-center gap-1">
                        {post.media.title}
                        <Icon name="external-link" className="w-3 h-3 opacity-60" />
                      </div>
                      <div className="text-[10px] opacity-70 truncate">{post.media.url}</div>
                    </div>
                  </a>
                )}
              </div>
            )}

            {post.checklist && post.checklist.length > 0 && (
              <div className="mb-3 space-y-1 bg-black/5 p-2 rounded-xl">
                {post.checklist.map((item) => (
                  <label
                    key={item.id}
                    className="flex items-center space-x-2 text-xs cursor-pointer select-none"
                  >
                    <input
                      type="checkbox"
                      checked={item.done}
                      onChange={() => onToggleChecklist(item.id)}
                      className="rounded text-indigo-600 focus:ring-0 cursor-pointer"
                    />
                    <span className={item.done ? 'line-through opacity-50' : 'font-medium'}>
                      {item.text}
                    </span>
                  </label>
                ))}
              </div>
            )}

            {post.tags && post.tags.length > 0 && (
              <div className="flex flex-wrap gap-1 mb-3">
                {post.tags.map((tag) => (
                  <span
                    key={tag}
                    className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-black/10 opacity-80"
                  >
                    #{tag}
                  </span>
                ))}
              </div>
            )}
          </div>

          <div className="pt-2 border-t border-black/10 flex flex-col gap-2">
            <div className="flex items-center justify-between text-xs">
              <button
                type="button"
                onClick={onLike}
                className="flex items-center space-x-1 hover:opacity-80 transition"
                title="좋아요"
              >
                <Icon name="heart" className="w-3.5 h-3.5 text-rose-500" />
                <span className="font-semibold text-[11px]">{post.likes || 0}</span>
              </button>

              <button
                type="button"
                onClick={() => setShowComments(!showComments)}
                className="flex items-center space-x-1 hover:opacity-80 transition"
                title="댓글 보기"
              >
                <Icon name="message-square" className="w-3.5 h-3.5 text-indigo-500" />
                <span className="font-semibold text-[11px]">
                  {post.comments ? post.comments.length : 0}
                </span>
              </button>

              {columns && columns.length > 1 && (
                <select
                  value={post.column}
                  onChange={(e) => onMoveColumn(e.target.value)}
                  className="bg-black/5 hover:bg-black/10 text-[10px] font-semibold rounded-lg px-1.5 py-0.5 border-none focus:ring-0 cursor-pointer"
                >
                  {columns.map((col) => (
                    <option key={col} value={col}>
                      {col}
                    </option>
                  ))}
                </select>
              )}
            </div>

            {showComments && (
              <div className="mt-2 space-y-2 pt-2 border-t border-black/10">
                <div className="max-h-28 overflow-y-auto space-y-1 pr-1">
                  {(post.comments || []).map((cm) => (
                    <div key={cm.id} className="bg-black/5 p-1.5 rounded-lg text-[11px]">
                      <div className="flex justify-between font-bold text-[10px] opacity-70">
                        <span>{cm.author}</span>
                        <span>{cm.timestamp}</span>
                      </div>
                      <div className="mt-0.5">{cm.text}</div>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSubmitComment} className="flex items-center gap-1">
                  <input
                    type="text"
                    placeholder="댓글을 입력하세요..."
                    value={commentInput}
                    onChange={(e) => setCommentInput(e.target.value)}
                    className="w-full bg-black/5 text-xs rounded-lg px-2 py-1 focus:outline-none"
                  />
                  <button
                    type="submit"
                    className="bg-indigo-600 text-white text-[10px] px-2 py-1 rounded-lg font-bold hover:bg-indigo-500 shrink-0"
                  >
                    등록
                  </button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DraggableCanvasPost({ post, onUpdatePos, ...props }) {
      const [isDragging, setIsDragging] = useState(false);
      const [position, setPosition] = useState({ x: post.x || 50, y: post.y || 60 });
      const dragOffsetRef = useRef({ x: 0, y: 0 });

      const handleMouseDown = (e) => {
        if (e.target.closest('button') || e.target.closest('input')) return;
        setIsDragging(true);
        dragOffsetRef.current = { x: e.clientX - position.x, y: e.clientY - position.y };
      };

      useEffect(() => {
        const handleMove = (e) => {
          if (!isDragging) return;
          setPosition({ x: Math.max(10, e.clientX - dragOffsetRef.current.x), y: Math.max(10, e.clientY - dragOffsetRef.current.y) });
        };
        const endDrag = () => {
          if (isDragging) {
            setIsDragging(false);
            onUpdatePos(position.x, position.y);
          }
        };
        if (isDragging) {
          window.addEventListener('mousemove', handleMove);
          window.addEventListener('mouseup', endDrag);
        }
        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', endDrag);
        };
      }, [isDragging, position, onUpdatePos]);

      return (
        <div onMouseDown={handleMouseDown} style={{ position: 'absolute', left: `${position.x}px`, top: `${position.y}px`, cursor: isDragging ? 'grabbing' : 'grab' }} className={`w-72 transition-shadow ${isDragging ? 'shadow-2xl z-30' : 'z-20'}`}>
          <PostCard post={post} {...props} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
