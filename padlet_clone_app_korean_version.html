<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 협업 패들렛 (Korean Version)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- INITIAL DEFAULT DATA ---
    const DEFAULT_BOARDS = [
      {
        id: 'board-1',
        title: '🚀 팀 브레인스토밍 & 프로젝트 보드',
        description: '아이디어, 자료 조사, 그리고 할 일을 함께 공유하는 협업 공간입니다.',
        layout: 'grid',
        bgType: 'gradient',
        bgValue: 'from-slate-900 via-indigo-950 to-slate-900',
        columns: ['할 일 (To Do)', '진행 중', '완료'],
        posts: [
          {
            id: 'post-1',
            title: '🎨 브랜드 아이덴티티 개편',
            content: '핵심 비주얼 에셋을 새롭게 업데이트합니다. 세련된 컬러 팔레트와 모던한 타이포그래피를 검토 중입니다.',
            column: '진행 중',
            color: '#fef3c7',
            tags: ['디자인', '중요'],
            likes: 12,
            pinned: true,
            x: 40,
            y: 40,
            checklist: [
              { id: 'c1', text: '컬러 대비 검토', done: true },
              { id: 'c2', text: '로고 벡터 추출', done: false }
            ],
            comments: [
              { id: 'cm1', author: '김철수', text: '컬러톤이 아주 따뜻하고 좋네요!', timestamp: '오전 10:15' }
            ]
          },
          {
            id: 'post-2',
            title: '⚡ 실시간 동기화 기능 구현 완료',
            content: '웹 앱이 성공적으로 생성되었습니다! 새로운 카드를 추가하고 동료들과 공유해보세요.',
            column: '완료',
            color: '#e0f2fe',
            tags: ['개발', '배포'],
            likes: 8,
            pinned: false,
            x: 380,
            y: 60,
            checklist: [],
            comments: []
          }
        ]
      }
    ];

    const CARD_COLORS = [
      { label: '클린 화이트', bg: '#ffffff' },
      { label: '따뜻한 앰버', bg: '#fef3c7' },
      { label: '스카이 블루', bg: '#e0f2fe' },
      { label: '프레시 그린', bg: '#dcfce7' },
      { label: '로즈 핑크', bg: '#ffe4e6' },
      { label: '라벤더', bg: '#f3e8ff' }
    ];

    function App() {
      const [boards, setBoards] = useState(() => {
        const saved = localStorage.getItem('padlet_boards');
        return saved ? JSON.parse(saved) : DEFAULT_BOARDS;
      });
      const [activeBoardId, setActiveBoardId] = useState(boards[0]?.id || 'board-1');
      const [searchQuery, setSearchQuery] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);

      const [postForm, setPostForm] = useState({
        title: '',
        content: '',
        color: '#ffffff',
        tags: '',
        column: '할 일 (To Do)'
      });

      useEffect(() => {
        localStorage.setItem('padlet_boards', JSON.stringify(boards));
      }, [boards]);

      const activeBoard = boards.find((b) => b.id === activeBoardId) || boards[0];

      const handleAddPost = (e) => {
        e.preventDefault();
        if (!postForm.title.trim() && !postForm.content.trim()) return;

        const newPost = {
          id: `post-${Date.now()}`,
          title: postForm.title || '제목 없음',
          content: postForm.content,
          column: postForm.column,
          color: postForm.color,
          tags: postForm.tags ? postForm.tags.split(',').map(t => t.trim()) : [],
          likes: 0,
          pinned: false,
          checklist: [],
          comments: []
        };

        const updatedBoard = {
          ...activeBoard,
          posts: [newPost, ...activeBoard.posts]
        };

        setBoards(boards.map(b => b.id === activeBoard.id ? updatedBoard : b));
        setIsModalOpen(false);
        setPostForm({ title: '', content: '', color: '#ffffff', tags: '', column: activeBoard.columns[0] });
      };

      const handleLike = (postId) => {
        const updatedPosts = activeBoard.posts.map(p =>
          p.id === postId ? { ...p, likes: p.likes + 1 } : p
        );
        setBoards(boards.map(b => b.id === activeBoard.id ? { ...activeBoard, posts: updatedPosts } : b));
      };

      const handleDelete = (postId) => {
        const updatedPosts = activeBoard.posts.filter(p => p.id !== postId);
        setBoards(boards.map(b => b.id === activeBoard.id ? { ...activeBoard, posts: updatedPosts } : b));
      };

      const filteredPosts = activeBoard.posts.filter(p =>
        p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.content.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="min-h-screen flex flex-col font-sans bg-slate-950 text-slate-100">
          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-lg">P</div>
              <div>
                <h1 className="font-bold text-base">{activeBoard.title}</h1>
                <p className="text-xs text-slate-400">{activeBoard.description}</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <input
                type="text"
                placeholder="검색..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="bg-slate-800 text-xs px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none"
              />
              <button
                onClick={() => setIsModalOpen(true)}
                className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-lg"
              >
                + 새 카드 작성
              </button>
            </div>
          </header>

          {/* Main Board */}
          <main className="flex-1 p-6">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {filteredPosts.map((post) => (
                <div
                  key={post.id}
                  className="rounded-2xl p-4 text-slate-900 shadow-xl border border-slate-200/50 flex flex-col justify-between"
                  style={{ backgroundColor: post.color }}
                >
                  <div>
                    <div className="flex justify-between items-start mb-2">
                      <h3 className="font-bold text-sm">{post.title}</h3>
                      <button
                        onClick={() => handleDelete(post.id)}
                        className="text-xs text-slate-400 hover:text-rose-600 font-bold"
                      >
                        ✕
                      </button>
                    </div>
                    {post.content && (
                      <p className="text-xs text-slate-700 mb-3 whitespace-pre-line leading-relaxed">
                        {post.content}
                      </p>
                    )}
                    {post.tags.length > 0 && (
                      <div className="flex flex-wrap gap-1 mb-3">
                        {post.tags.map(t => (
                          <span key={t} className="text-[10px] bg-black/10 px-2 py-0.5 rounded-full font-semibold">
                            #{t}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="pt-2 border-t border-black/10 flex justify-between items-center text-xs">
                    <button
                      onClick={() => handleLike(post.id)}
                      className="flex items-center space-x-1 hover:opacity-70 font-semibold"
                    >
                      <span>❤️</span>
                      <span>{post.likes}</span>
                    </button>
                    <span className="text-[10px] bg-black/5 px-2 py-0.5 rounded font-medium">
                      {post.column}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full">
                <h3 className="font-bold text-base mb-4">새 카드 만들기</h3>
                <form onSubmit={handleAddPost} className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 font-semibold text-slate-300">제목</label>
                    <input
                      type="text"
                      placeholder="카드 제목"
                      value={postForm.title}
                      onChange={(e) => setPostForm({ ...postForm, title: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-slate-100"
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-semibold text-slate-300">내용</label>
                    <textarea
                      rows="3"
                      placeholder="내용을 입력하세요..."
                      value={postForm.content}
                      onChange={(e) => setPostForm({ ...postForm, content: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-slate-100"
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-semibold text-slate-300">카드 배경색</label>
                    <div className="flex space-x-2">
                      {CARD_COLORS.map(c => (
                        <button
                          key={c.bg}
                          type="button"
                          onClick={() => setPostForm({ ...postForm, color: c.bg })}
                          className={`w-6 h-6 rounded-full border-2 ${postForm.color === c.bg ? 'ring-2 ring-indigo-500' : ''}`}
                          style={{ backgroundColor: c.bg }}
                        />
                      ))}
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold"
                    >
                      생성하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
